name: Nanobot fork regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qq-image-queue:
    name: QQ and image queue
    if: github.repository == 'zzzhty/nanobot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Install test dependencies and the QQ SDK
        run: |
          uv venv --python 3.13
          uv pip install -r pyproject.toml 'pytest>=9,<10' 'pytest-asyncio>=1.3,<2'
          .venv/bin/python -m scripts.install_channel_dependencies qq
      - name: Check import boundaries
        run: .venv/bin/python -m scripts.check_import_boundaries
      - name: Run offline regressions
        run: >-
          .venv/bin/python -m pytest -q
          tests/agent/test_image_queue.py
          tests/agent/test_image_queue_reliability.py
          tests/agent/test_loop_image_generation_media.py
          tests/agent/test_qq_fork_behavior.py
          tests/channels/test_qq_fork_behavior.py
          tests/tools/test_message_tool.py
          tests/tools/test_message_tool_suppress.py
          nanobot/channels/qq/tests
